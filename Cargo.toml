[package]
name = "export-findmy"
version = "0.1.0"
edition = "2024"
description = "Export AirTag/FindMy accessory private keys from iCloud, producing plist files compatible with FindMy.py"

[dependencies]
rustpush = { git = "https://github.com/malmeloo/rustpush.git", branch = "next", default-features = false, features = [
    "remote-anisette-v3",
] }
omnisette = { git = "https://github.com/malmeloo/rustpush.git", branch = "next" }
keystore = { git = "https://github.com/malmeloo/rustpush.git", branch = "next" }
tokio = { version = "1", features = ["full"] }
plist = "1.7.0"
sha2 = "0.10.8"
async-trait = "0.1.73"
uuid = { version = "1.4.1", features = ["v4"] }
rand = "0.8.5"
libc = "0.2"
